<!doctype html>
<html lang="zh-CN" data-theme="dark" data-skin="deepspace">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MotionKit — 可交互 UI 动效样式库：实时调参、代码复制、AI 智能推荐与整套皮肤切换。" />
    <title>MotionKit · UI 动效系统</title>
    <script>
      /* 首屏防闪烁：在样式生效前先恢复主题与皮肤标记 */
      (function () {
        var d = document.documentElement
        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key)
            return raw === null ? fallback : JSON.parse(raw)
          } catch (e) {
            return fallback
          }
        }
        var theme = read('motionkit.theme', 'dark')
        if (theme !== 'light' && theme !== 'dark') theme = 'dark'
        var skin = read('motionkit.skin', 'deepspace')
        if (typeof skin !== 'string') skin = 'deepspace'
        d.dataset.theme = theme
        d.dataset.skin = skin
        d.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
